[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-generator"
version = "0.1.0"
description = "Package for generating workout images with muscle activation visualization"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["workout", "exercise", "visualization", "fitness", "muscle", "anatomy"]
authors = [
    {name = "Workout Generator Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
"Homepage" = "https://github.com/buzzedtop/workout_generator"
"Bug Tracker" = "https://github.com/buzzedtop/workout_generator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["workout_generator*"]
exclude = ["tests*"]
